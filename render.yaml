services:
  - type: web
    name: rozlf-auto-trader
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REAL_TRADING_APPROVED
        value: "false"
      - key: MT5_ENABLED
        value: "false"
      - key: MT5_BRIDGE_URL
        sync: false
      - key: MT5_BRIDGE_TOKEN
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
