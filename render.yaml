services:
  - type: web
    name: rozlf-auto-trader
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_SECRET_KEY_PREVIOUS
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_TOKEN
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: rozlf-db
          property: connectionString
      - key: REAL_TRADING_APPROVED
        value: "false"
      - key: MT5_ENABLED
        value: "false"
      - key: MT5_BRIDGE_URL
        sync: false
      - key: MT5_BRIDGE_TOKEN
        sync: false
      - key: MT5_BRIDGE_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: EXPERTOPTION_SESSION_COOKIE
        sync: false
      - key: EXPERTOPTION_BRIDGE_URL
        sync: false
      - key: EXPERTOPTION_BRIDGE_KEY
        sync: false
      - key: EXPERTOPTION_SESSION_TOKEN
        sync: false
      - key: EXPERTOPTION_RESTORE_SESSION
        value: "true"
      - key: EXPERTOPTION_ALLOW_REAL_READ
        value: "true"
      - key: EXPERTOPTION_API_BASE_URL
        sync: false
      - key: EXPERTOPTION_API_KEY
        sync: false
      - key: EXPERTOPTION_API_TIMEOUT_MS
        value: "10000"
      - key: EXPERTOPTION_MIN_CANDLES
        value: "80"
      - key: EXPERTOPTION_MAX_CANDLE_AGE_SECONDS
        value: "120"
      - key: ALLOW_INSECURE_DASHBOARD
        value: "false"
      - key: SCAN_INTERVAL_SECONDS
        value: "60"

  - type: web
    name: rozlf-eo-bridge
    runtime: docker
    plan: free
    rootDir: .
    dockerfilePath: ./eo_bridge/Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: EO_BRIDGE_API_KEY
        sync: false
      - key: EO_BRIDGE_DEMO_ONLY
        value: "true"
      - key: EO_BRIDGE_REGION
        value: EUROPE
      - key: EO_BRIDGE_LOG_LEVEL
        value: INFO
      - key: EO_BRIDGE_ALLOW_REAL_READ
        value: "true"
      - key: EO_BRIDGE_QUOTE_MAX_AGE_SECONDS
        value: "20"

databases:
  - name: rozlf-db
    plan: free
    databaseName: rozlf
    user: rozlf
