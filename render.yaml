services:
  - type: web
    name: rozlf-auto-trader
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: APP_SECRET_KEY_PREVIOUS
        sync: false
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: rozlf-db
          property: connectionString
      - key: REAL_TRADING_APPROVED
        value: "false"
      - key: MT5_ENABLED
        value: "false"
      - key: MT5_BRIDGE_URL
        sync: false
      - key: MT5_BRIDGE_TOKEN
        sync: false
      - key: MT5_BRIDGE_SECRET
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: MISTRAL_MODEL
        value: mistral-small-latest
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: PUBLIC_APP_URL
        value: https://rozlf-auto-triding-1.onrender.com
      - key: EXPERTOPTION_BRIDGE_URL
        sync: false
      - key: EXPERTOPTION_BRIDGE_KEY
        sync: false
      - key: EXPERTOPTION_SESSION_TOKEN
        sync: false
      - key: EXPERTOPTION_RESTORE_SESSION
        value: "true"
      - key: EXPERTOPTION_ALLOW_REAL_READ
        value: "true"
      - key: EXPERTOPTION_API_BASE_URL
        sync: false
      - key: EXPERTOPTION_API_KEY
        sync: false
      - key: EXPERTOPTION_API_TIMEOUT_MS
        value: "10000"
      - key: EXPERTOPTION_MIN_CANDLES
        value: "80"
      - key: EXPERTOPTION_MAX_CANDLE_AGE_SECONDS
        value: "120"
      - key: ALLOW_INSECURE_DASHBOARD
        value: "false"
      - key: SCAN_INTERVAL_SECONDS
        value: "60"

databases:
  - name: rozlf-db
    plan: free
    databaseName: rozlf
    user: rozlf
