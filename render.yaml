services:
  - type: web
    name: rozlf-auto-trader
    runtime: python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: APP_SECRET_KEY
        generateValue: true
      - key: DASHBOARD_TOKEN
        sync: false
      - key: REAL_TRADING_APPROVED
        value: "false"
      - key: MT5_ENABLED
        value: "false"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
