<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#327fcc"><title>ربط ExpertOption — ROZLF</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=11">
  <style>
    body{display:grid;place-items:center;padding:22px}.link-card{width:min(100%,560px);background:#fff;border:1px solid #e3eaf2;border-radius:26px;padding:clamp(22px,5vw,38px);box-shadow:0 24px 70px rgba(32,75,120,.12)}
    .link-brand{font-weight:900;letter-spacing:.18em;color:#327fcc;font-size:1.05rem}.link-card h1{font-size:1.55rem;margin:18px 0 8px}.link-card p{color:#6b7b90;margin:0 0 20px}.link-card input{width:100%;border:1px solid #d8e2ed;border-radius:14px;padding:15px;background:#f8fbff;direction:ltr;text-align:left}.link-card button{width:100%;margin-top:16px}.link-note{font-size:.8rem;margin-top:14px!important}.link-result{margin-top:16px;font-weight:700;min-height:24px}.link-result.error{color:#d64b57}.link-result.ok{color:#168b6d}
  </style>
</head>
<body>
  <main class="link-card">
    <div class="link-brand">ROZLF</div>
    <h1>ربط حساب ExpertOption</h1>
    <p>أدخل Session Token في هذه الصفحة الآمنة فقط. لا ترسله كرسالة في Telegram ولا تشاركه مع أي شخص.</p>
    <form id="link-form" autocomplete="off">
      <label class="field"><span>Session Token أو Cookie string</span><input id="session-token" type="password" required autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ألصق بيانات الجلسة هنا"></label>
      <button class="btn btn-primary" id="submit-btn" type="submit">تحقق واربط الحساب</button>
    </form>
    <p class="link-note">الرابط مؤقت ولمرة واحدة. تُحفظ الجلسة مشفّرة بعد قبولها، ويعمل ROZLF في وضع القراءة والتحليل فقط.</p>
    <div class="link-result" id="result" role="status" aria-live="polite"></div>
  </main>
  <script src="/static/js/telegram-connect.js?v=1"></script>
</body></html>
